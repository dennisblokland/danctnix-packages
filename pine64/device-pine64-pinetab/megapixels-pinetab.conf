# Megapixels (libmegapixels) camera config for the PineTab.
#
# Based on pine64,pinephone.conf from libmegapixels: same SoC, sensors
# (ov5640 rear, gc2145 front) and CSI driver. The pine64,pinetab.conf that
# libmegapixels ships still links to the old "sun6i-csi" entity, which is
# "sun6i-csi-bridge" on current kernels, so it finds no camera. The PineTab
# has no flash LED, so FlashPath is left out (the rear camera fails to open
# with it). Installed for both DT compatibles: pine64,pinetab-early-adopter
# (retail units) and pine64,pinetab (Developer Sample).

Version = 1;
Make: "PINE64";
Model: "PineTab";

Rear: {
    SensorDriver: "ov5640";
    BridgeDriver: "sun6i-csi";
    IsoMin: 100;
    IsoMax: 64000;

    Modes: (
        {
            Width: 2592;
            Height: 1944;
            Rate: 15;
            Format: "BGGR8";
            Rotate: 270;
            FocalLength: 3.33;
            FNumber: 3.0;

            Pipeline: (
                {Type: "Link", From: "ov5640", FromPad: 0, To: "sun6i-csi-bridge", ToPad: 0},
                {Type: "Mode", Entity: "ov5640"},
                {Type: "Mode", Entity: "sun6i-csi-bridge"}
            );
        },
        {
            Width: 1280;
            Height: 720;
            Rate: 30;
            Format: "BGGR8";
            Rotate: 270;
            FocalLength: 3.33;
            FNumber: 3.0;

            Pipeline: (
                {Type: "Link", From: "ov5640", FromPad: 0, To: "sun6i-csi-bridge", ToPad: 0},
                {Type: "Mode", Entity: "ov5640"},
                {Type: "Mode", Entity: "sun6i-csi-bridge"}
            );
        },
        {
            Width: 1280;
            Height: 720;
            Rate: 30;
            Format: "YUYV";
            Rotate: 270;
            FocalLength: 3.33;
            FNumber: 3.0;

            Pipeline: (
                {Type: "Link", From: "ov5640", FromPad: 0, To: "sun6i-csi-bridge", ToPad: 0},
                {Type: "Mode", Entity: "ov5640"},
                {Type: "Mode", Entity: "sun6i-csi-bridge"}
            );

        }
    );
};

Front: {
    SensorDriver: "gc2145";
    BridgeDriver: "sun6i-csi";
    FlashDisplay: true;

    Modes: (
        {
            Width: 1280;
            Height: 720;
            Rate: 60;
            Format: "BGGR8";
            Rotate: 90;
            Mirror: true;

            Pipeline: (
                {Type: "Link", From: "gc2145", FromPad: 0, To: "sun6i-csi-bridge", ToPad: 0},
                {Type: "Mode", Entity: "gc2145"},
                {Type: "Mode", Entity: "sun6i-csi-bridge"}
            );
        }
    );
};
